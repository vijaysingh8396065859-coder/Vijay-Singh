name: Build Android APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Generate debug keystore and fallback web client id
        run: |
          if [ ! -f "./debug.keystore" ]; then
            keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          RES_DIR="app/src/main/res/values"
          mkdir -p "$RES_DIR"
          STRINGS_FILE="$RES_DIR/strings.xml"
          if [ ! -f "$STRINGS_FILE" ]; then
            printf '<resources>\n    <string name="default_web_client_id" translatable="false">YOUR_WEB_CLIENT_ID</string>\n</resources>\n' > "$STRINGS_FILE"
          elif ! grep -q "default_web_client_id" "$STRINGS_FILE"; then
            python3 -c 'from pathlib import Path; p = Path("app/src/main/res/values/strings.xml"); t = p.read_text(encoding="utf-8"); tag = "<string name=\"default_web_client_id\" translatable=\"false\">YOUR_WEB_CLIENT_ID</string>"; p.write_text(t.replace("</resources>", f"    {tag}\n</resources>", 1), encoding="utf-8") if "</resources>" in t else None'
          fi
      - name: Build Debug APK
        run: |
          if [ -f "./gradlew" ]; then
            chmod +x ./gradlew
            ./gradlew assembleDebug
          else
            gradle assembleDebug
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: "**/*.apk"
